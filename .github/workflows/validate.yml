# Repository validation: layout, structure, generated project freshness and a
# secrets scan. Runs on every push. No secrets are used or required.
name: Validate repository

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Swift toolchain (for the parse check)
        uses: swift-actions/setup-swift@v2
        continue-on-error: true
        with:
          swift-version: "6.0.3"

      - name: Repository validation
        run: ./scripts/validate_project.sh

      - name: Generated Xcode project is current
        run: python3 scripts/generate_xcode_project.py --check
