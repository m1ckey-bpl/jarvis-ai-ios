# The iOS app: Swift engine tests on the macOS runner, then an UNSIGNED .ipa
# build, structural verification and artefact upload.
#
# Nothing here needs a signing certificate, a provisioning profile, an Apple ID
# or a paid developer account. Secrets are deliberately absent: if this workflow
# required one, the guarantee that the repository holds no credentials would be
# broken. Free macOS runner minutes are only granted to public repositories —
# see docs/FREE_TIER_POLICY.md.
name: iOS

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Engine tests (SwiftPM)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build the engine with tests
        working-directory: ios
        run: swift build --build-tests

      - name: Run the engine test suite
        working-directory: ios
        run: swift test --skip-build 2>&1 | tee "$RUNNER_TEMP/swift-tests.log"

      - name: Summarise results
        if: always()
        run: |
          {
            echo "### Swift engine tests"
            echo '```'
            grep -E "Executed [0-9]+ tests" "$RUNNER_TEMP/swift-tests.log" | tail -3 || echo "no result line"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Errors (copy this block when asking for a fix)
        if: failure()
        run: |
          {
            echo "### Swift engine errors"
            echo '```'
            grep -E "error:" "$RUNNER_TEMP/swift-tests.log" 2>/dev/null | sort -u | head -40 \
              || echo "no 'error:' lines captured — see the swift-test-log artifact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: swift-test-log
          path: ${{ runner.temp }}/swift-tests.log
          retention-days: 14

  unsigned-ipa:
    name: Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45
    needs: tests
    # `write` is needed only for the tag path below, which attaches the artefact to a
    # GitHub Release (a download link that outlives the 90-day artifact retention).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate and verify the Xcode project
        run: python3 scripts/generate_xcode_project.py --check

      - name: Build and package the unsigned IPA
        run: ./scripts/build_unsigned_ipa.sh --configuration Release --output dist

      - name: Show the artefact
        run: |
          ls -lh dist
          shasum -a 256 dist/*.ipa | tee dist/JarvisApp-unsigned.sha256

      - name: Summarise the artefact
        run: |
          {
            echo "### Unsigned IPA"
            echo '```'
            ls -lh dist/*.ipa
            cat dist/JarvisApp-unsigned.sha256
            echo '```'
            echo "This build is unsigned by design. Sign it with your own method before installing."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: JarvisApp-unsigned-ipa
          path: |
            dist/*.ipa
            dist/*.sha256
          retention-days: 90

      - name: Compile errors (copy this block when asking for a fix)
        if: failure()
        run: |
          {
            echo "### SwiftUI / Xcode compile errors"
            echo '```'
            grep -E "error:" build/unsigned/xcodebuild.log 2>/dev/null | sort -u | head -40 \
              || echo "no 'error:' lines captured — see the ios-build-diagnostics artifact"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the IPA to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --title "JARVIS $TAG" \
                 --notes "Unsigned build — sign it with your own method before installing. No credentials are bundled."
          gh release upload "$TAG" dist/*.ipa dist/*.sha256 --clobber
          echo "Attached dist/*.ipa to release $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: |
            build/unsigned/xcodebuild.log
            build/unsigned/DerivedData/Logs/**
          if-no-files-found: ignore
          retention-days: 7
